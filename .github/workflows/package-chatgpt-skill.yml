name: Package ChatGPT Skill

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill.zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chatgpt-skill
          mkdir -p /tmp/chatgpt-skill/open-kimi-ppt/agents
          cp -a skills/open-kimi-ppt/. /tmp/chatgpt-skill/open-kimi-ppt/
          cat > /tmp/chatgpt-skill/open-kimi-ppt/agents/openai.yaml <<'EOF'
          interface:
            display_name: "Open Kimi PPT"
            short_description: "Create, edit, replicate, and export editable PPTD and PPTX presentations."
          EOF
          cd /tmp/chatgpt-skill
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("open-kimi-ppt")
          with zipfile.ZipFile("skill.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      z.write(p, p.as_posix())
          print(Path("skill.zip").stat().st_size)
          PY
      - name: Upload packaged skill
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-open-kimi-ppt-skill
          path: /tmp/chatgpt-skill/skill.zip
          if-no-files-found: error
          retention-days: 1
